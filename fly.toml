app = "life-manager-fragrant-fog-1910"
primary_region = "atl"

[build]

[env]
  LM_DATA_DIR = "/data"
  LM_PORT = "8080"
  # Everything in the app that asks "what day is it?" (week rollover, overdue
  # coloring, notify time, etc.) uses this zone. Without it the container
  # runs in UTC and rolls the week over around 7–8 PM EST on Sunday.
  LM_TIMEZONE = "America/New_York"
  TZ = "America/New_York"
  # Tame glibc malloc fragmentation under low RAM (helps avoid OOM).
  MALLOC_ARENA_MAX = "2"
  # Set to "1" if you don't use the Fantasy tab — it skips the multi-MB
  # Sleeper players download and the weekly trade-refresh job, freeing RAM.
  # LM_DISABLE_FANTASY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Routine push reminders are sent by an in-process scheduler, so the
  # machine has to stay awake: with auto-stop enabled the app only ran while
  # a page was open, and reminders almost never fired. Always-on costs the
  # full ~$1.94/mo for the 512 MB shared-cpu-1x instead of a fraction of it.
  # A GitHub Actions cron (.github/workflows/reminder-ping.yml) also hits
  # /api/push/run-reminders every 30 minutes as a backstop — it auto-starts
  # the machine, so reminders keep working even if you switch auto-stop back
  # on to save money.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "lm_data"
  destination = "/data"

[[vm]]
  # The Flask + reportlab + pillow + pywebpush + bs4 + plaid stack alone is
  # ~110 MB resident on a fresh boot. 256 MB left almost no headroom for
  # request buffers and was OOM-killing the machine when the Budget or
  # Fantasy tabs loaded. 512 MB ($1.94/mo on Fly's shared-cpu-1x) is the
  # cheapest size that holds the whole app comfortably; 1 GB is the safe
  # default if you also use the Fantasy tab heavily.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
